# Baut die Android-Widget-App und stellt die APK unter Releases → „widget-latest“ bereit.
name: Widget-App
on:
  push:
    branches: [main]
    paths: ['android-widget/**', '.github/workflows/widget.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - name: Android SDK bereitstellen
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/android-sdk}}"
          echo "SDK: $SDK"; ls "$SDK" 2>/dev/null | head || true
          if [ ! -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK/cmdline-tools"
            curl -sSLo /tmp/clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/clt.zip -d /tmp/clt && rm -rf "$SDK/cmdline-tools/latest" && mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Signierschlüssel bereitstellen
        env: { KS: '${{ secrets.WIDGET_KEYSTORE }}' }
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > android-widget/app/widget.keystore; fi
      - name: APK bauen
        env: { WIDGET_KEY_PASS: '${{ secrets.WIDGET_KEY_PASS }}' }
        run: |
          set -o pipefail
          gradle -p android-widget assembleRelease --no-daemon 2>&1 | tee build.log || {
            # Fehlerzeilen als Anmerkungen, damit sie ohne Log-Zugriff sichtbar sind
            grep -E '^e: |error:|FAILURE|What went wrong' -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          cp android-widget/app/build/outputs/apk/release/app-release.apk familien-widget.apk
      - name: Release aktualisieren
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release view widget-latest >/dev/null 2>&1 || gh release create widget-latest --title "Familien-Widget (Android)" --notes "Android-App mit Widget für heutige Familientermine und Pinnwand. APK herunterladen und installieren."
          gh release upload widget-latest familien-widget.apk --clobber
