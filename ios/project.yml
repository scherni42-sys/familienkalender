# Xcode-Projekt für FamTO auf dem iPhone (App + Widget). Wird im GitHub-Bau mit XcodeGen erzeugt.
name: FamTO
options:
  bundleIdPrefix: de.famto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  FamTO:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.famto.app
        PRODUCT_NAME: FamTO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FamTO.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: FamTOWidget
  FamTOWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.famto.app.widget
        PRODUCT_NAME: FamTOWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/FamTOWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
