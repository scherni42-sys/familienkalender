# FamTO-Server: Forgejo (Code und Bau), Datenbank für Forgejo, Bau-Runner und Caddy (HTTPS, Web-App).
# Start: im Ordner /srv/famto/server  →  docker compose up -d
# Die Versionsnummern beim Einrichten mit forgejo.org abgleichen und auf die aktuelle Hauptversion setzen.
services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:13
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD: ${DB_PASSWORD}
      FORGEJO__server__DOMAIN: git.${DOMAIN}
      FORGEJO__server__ROOT_URL: https://git.${DOMAIN}/
      FORGEJO__server__SSH_PORT: 2222
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "true"
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__actions__DEFAULT_ACTIONS_URL: https://github.com
    volumes:
      - /srv/famto/forgejo:/data
    ports:
      - "2222:22"
    depends_on: [db]

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: forgejo
      POSTGRES_USER: forgejo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - /srv/famto/postgres:/var/lib/postgresql/data

  runner:
    image: code.forgejo.org/forgejo/runner:11
    restart: unless-stopped
    user: "0:0"
    command: forgejo-runner daemon --config /data/config.yml
    volumes:
      - /srv/famto/runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [forgejo]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/famto/app:/srv/app:ro
      - /srv/famto/caddy:/data
